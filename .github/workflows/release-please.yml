on:
  push:
    branches:
      - master

permissions:
  issues: write
  contents: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # this assumes that you have created a personal access token
          # (PAT) and configured it as a GitHub action secret named
          # `MY_RELEASE_PLEASE_TOKEN` (this secret name is not important).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          # do NOT set release-type here: when release-type is set,
          # release-please uses Manifest.fromConfig() and ignores
          # .github/release-please-config.json entirely.
          # omitting it forces Manifest.fromManifest() which reads
          # changelog-sections from the config file.

